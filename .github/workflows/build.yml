name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Восстановление файлов проекта
        run: |
          python3 -c '
          a = "android:" + "name"
          xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission {a}="android.permission.CAMERA" />
              <uses-permission {a}="android.permission.FLASHLIGHT" />
              <uses-permission {a}="android.permission.FOREGROUND_SERVICE" />
              <uses-permission {a}="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission {a}="android.permission.POST_NOTIFICATIONS" />
              <uses-feature {a}="android.hardware.camera.flash" android:required="true" />
              <uses-feature {a}="android.hardware.sensor.light" android:required="true" />
              <application
                  android:allowBackup="true"
                  android:label="AutoFlashlight"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity {a}=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action {a}="android.intent.action.MAIN" />
                          <category {a}="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service {a}=".LightMonitorService" android:enabled="true" android:exported="false" android:foregroundServiceType="specialUse">
                      <property {a}="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Monitoring ambient light" />
                  </service>
              </application>
          </manifest>"""
          open("app/src/main/AndroidManifest.xml", "w").write(xml)
          '
          sed -i 's/val currentLux = event\.values.*/val currentLux = event.values.first()/g' app/src/main/java/com/example/autoflashlight/LightMonitorService.kt

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка и запуск Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Сборка Debug APK
        run: gradle assembleDebug

      - name: Загрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoFlashlight-APK
          path: app/build/outputs/apk/debug/app-debug.apk
